<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Металлическая основа (многозональный градиент) -->
    <radialGradient id="coinMetal" cx="35%" cy="30%" r="85%">
      <stop offset="0%"   stop-color="#FFF9D6"/>
      <stop offset="18%"  stop-color="#FFE87A"/>
      <stop offset="42%"  stop-color="#F4C430"/>
      <stop offset="68%"  stop-color="#C89B1E"/>
      <stop offset="88%"  stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5A4500"/>
    </radialGradient>

    <!-- Тёплый блик сверху слева -->
    <radialGradient id="shineTL" cx="28%" cy="22%" r="40%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Тёплая тень снизу справа -->
    <radialGradient id="shadowBR" cx="72%" cy="78%" r="55%">
      <stop offset="0%"   stop-color="#3D2F00" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#3D2F00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3D2F00" stop-opacity="0"/>
    </radialGradient>

    <!-- Внутренний рельеф -->
    <radialGradient id="innerBevel" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="72%"  stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="88%"  stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Фильтр лёгкого блюра для мягких слоёв -->
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="tinyBlur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>

    <clipPath id="clipAIXFront">
      <text x="256" y="322" text-anchor="middle"
            font-family="'Arial Black', 'Impact', 'Helvetica', sans-serif"
            font-size="196" font-weight="900"
            letter-spacing="-6">AIX</text>
    </clipPath>
  </defs>

  <!-- ===== Основной диск ===== -->
  <circle cx="256" cy="256" r="250" fill="#5A4500"/>
  <circle cx="256" cy="256" r="247" fill="#8B6914"/>
  <circle cx="256" cy="256" r="242" fill="url(#coinMetal)"/>

  <!-- Гурт (мелкие насечки по краю) -->
  <g opacity="0.55">
    <circle cx="256" cy="256" r="245" fill="none" stroke="#5A4500" stroke-width="1.2" stroke-dasharray="2 3"/>
    <circle cx="256" cy="256" r="249" fill="none" stroke="#3D2F00" stroke-width="1.5" stroke-dasharray="1.5 4"/>
  </g>

  <!-- ===== Рельеф платы (тонкие дорожки) ===== -->
  <g opacity="0.32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Дорожки слева -->
    <g stroke="#7A5A10" stroke-width="2.4">
      <path d="M 45 130 H 115 L 135 150 H 172"/>
      <path d="M 45 168 H 100 L 118 186 H 155"/>
      <path d="M 45 206 H 78"/>
      <path d="M 45 312 H 115 L 132 295 H 165"/>
      <path d="M 45 350 H 98 L 115 333 H 150"/>
      <path d="M 45 388 H 75"/>
    </g>
    <!-- Дорожки справа -->
    <g stroke="#7A5A10" stroke-width="2.4">
      <path d="M 467 130 H 397 L 377 150 H 340"/>
      <path d="M 467 168 H 412 L 394 186 H 357"/>
      <path d="M 467 206 H 434"/>
      <path d="M 467 312 H 397 L 380 295 H 347"/>
      <path d="M 467 350 H 414 L 397 333 H 362"/>
      <path d="M 467 388 H 437"/>
    </g>
    <!-- Верхние и нижние -->
    <g stroke="#7A5A10" stroke-width="2">
      <path d="M 140 40 L 160 70 H 200"/>
      <path d="M 372 40 L 352 70 H 312"/>
      <path d="M 140 472 L 160 442 H 200"/>
      <path d="M 372 472 L 352 442 H 312"/>
    </g>
  </g>

  <!-- Точки-vias (маленькие кружки) -->
  <g fill="#7A5A10" opacity="0.5">
    <circle cx="45"  cy="130" r="3"/>
    <circle cx="45"  cy="168" r="3"/>
    <circle cx="45"  cy="206" r="3"/>
    <circle cx="45"  cy="312" r="3"/>
    <circle cx="45"  cy="350" r="3"/>
    <circle cx="45"  cy="388" r="3"/>
    <circle cx="467" cy="130" r="3"/>
    <circle cx="467" cy="168" r="3"/>
    <circle cx="467" cy="206" r="3"/>
    <circle cx="467" cy="312" r="3"/>
    <circle cx="467" cy="350" r="3"/>
    <circle cx="467" cy="388" r="3"/>
  </g>

  <!-- ===== Буквы AIX в триколоре ===== -->
  <g clip-path="url(#clipAIXFront)">
    <rect x="0"   y="0"   width="512" height="198" fill="#FFFFFF"/>
    <rect x="0"   y="198" width="512" height="62"  fill="#0039A6"/>
    <rect x="0"   y="260" width="512" height="260" fill="#D52B1E"/>

    <!-- Мягкая тень сверху (эффект рельефа) -->
    <rect x="0" y="0" width="512" height="522" fill="#000000" opacity="0.08"
          filter="url(#tinyBlur)"/>
  </g>

  <!-- Внутренняя тёмная обводка букв (эффект давления в металл) -->
  <g clip-path="url(#clipAIXFront)" filter="url(#tinyBlur)">
    <text x="258" y="324" text-anchor="middle"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="196" font-weight="900"
          letter-spacing="-6" fill="#000" opacity="0.35">AIX</text>
  </g>

  <!-- Чёткая обводка букв -->
  <g fill="none" stroke="#4A3800" stroke-width="2">
    <text x="256" y="322" text-anchor="middle"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="196" font-weight="900"
          letter-spacing="-6">AIX</text>
  </g>

  <!-- ===== Надпись COIN (с тиснением) ===== -->
  <g font-family="'Arial Black', 'Impact', sans-serif"
     font-size="62" font-weight="900" letter-spacing="10"
     text-anchor="middle">
    <text x="256" y="438" fill="#3D2F00" opacity="0.5"
          filter="url(#tinyBlur)">COIN</text>
    <text x="256" y="436" fill="#4A3800" opacity="0.85">COIN</text>
    <text x="256" y="434" fill="#FFE87A">COIN</text>
  </g>

  <!-- ===== Финальные блики и тени (реалистичность) ===== -->
  <circle cx="256" cy="256" r="242" fill="url(#shineTL)"/>
  <circle cx="256" cy="256" r="242" fill="url(#shadowBR)"/>
  <circle cx="256" cy="256" r="242" fill="url(#innerBevel)"/>
</svg>