<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="coinMetalB" cx="35%" cy="30%" r="85%">
      <stop offset="0%"   stop-color="#FFF9D6"/>
      <stop offset="18%"  stop-color="#FFE87A"/>
      <stop offset="42%"  stop-color="#F4C430"/>
      <stop offset="68%"  stop-color="#C89B1E"/>
      <stop offset="88%"  stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5A4500"/>
    </radialGradient>

    <radialGradient id="shineTLB" cx="28%" cy="22%" r="40%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shadowBRB" cx="72%" cy="78%" r="55%">
      <stop offset="0%"   stop-color="#3D2F00" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#3D2F00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3D2F00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="innerBevelB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="72%"  stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="88%"  stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </radialGradient>

    <linearGradient id="eagleMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7A5A10"/>
      <stop offset="35%"  stop-color="#5A4500"/>
      <stop offset="100%" stop-color="#2A2000"/>
    </linearGradient>

    <linearGradient id="eagleHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFE87A" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#FFE87A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFE87A" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlurB" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="tinyBlurB" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>

    <path id="textArcB" d="M 70,256 A 186,186 0 0,1 442,256"/>
  </defs>

  <!-- ===== Основной диск ===== -->
  <circle cx="256" cy="256" r="250" fill="#5A4500"/>
  <circle cx="256" cy="256" r="247" fill="#8B6914"/>
  <circle cx="256" cy="256" r="242" fill="url(#coinMetalB)"/>

  <g opacity="0.55">
    <circle cx="256" cy="256" r="245" fill="none" stroke="#5A4500" stroke-width="1.2" stroke-dasharray="2 3"/>
    <circle cx="256" cy="256" r="249" fill="none" stroke="#3D2F00" stroke-width="1.5" stroke-dasharray="1.5 4"/>
  </g>

  <!-- ===== Текст по дуге (без 21 000 000 000) ===== -->
  <g text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif">
    <text font-size="20" font-weight="900" letter-spacing="5"
          fill="#4A3800" opacity="0.85">
      <textPath href="#textArcB" startOffset="50%">
        ИМПЕРИЯ НАЧИНАЕТСЯ С ТЕБЯ
      </textPath>
    </text>
    <!-- Микро-подсветка сверху -->
    <text font-size="20" font-weight="900" letter-spacing="5"
          fill="#FFE87A" opacity="0.35" dy="-1">
      <textPath href="#textArcB" startOffset="50%">
        ИМПЕРИЯ НАЧИНАЕТСЯ С ТЕБЯ
      </textPath>
    </text>
  </g>

  <!-- ===== Стилизованный двуглавый орёл AIX ===== -->
  <g filter="url(#softBlurB)" opacity="0.35">
    <!-- Мягкая тень под орлом -->
    <ellipse cx="256" cy="300" rx="150" ry="20" fill="#2A2000"/>
  </g>

  <g>
    <!-- Левый хвост -->
    <path d="M 190,315
             C 175,345 155,375 145,395
             L 168,378 L 162,405
             L 188,378 L 190,405
             L 202,368 L 212,388
             L 216,340 Z"
          fill="url(#eagleMetal)"/>

    <!-- Правый хвост -->
    <path d="M 322,315
             C 337,345 357,375 367,395
             L 344,378 L 350,405
             L 324,378 L 322,405
             L 310,368 L 300,388
             L 296,340 Z"
          fill="url(#eagleMetal)"/>

    <!-- Левое крыло -->
    <path d="M 218,235
             C 180,225 130,215 95,205
             L 125,222 L 88,222
             L 130,240 L 92,255
             L 140,262 L 105,278
             L 152,282 L 122,300
             L 168,298 L 195,278
             L 218,275 Z"
          fill="url(#eagleMetal)"/>

    <!-- Правое крыло -->
    <path d="M 294,235
             C 332,225 382,215 417,205
             L 387,222 L 424,222
             L 382,240 L 420,255
             L 372,262 L 407,278
             L 360,282 L 390,300
             L 344,298 L 317,278
             L 294,275 Z"
          fill="url(#eagleMetal)"/>

    <!-- Тело-щит -->
    <path d="M 256,200
             C 245,208 234,220 230,232
             L 228,290
             C 240,315 250,332 256,340
             C 262,332 272,315 284,290
             L 282,232
             C 278,220 267,208 256,200 Z"
          fill="url(#eagleMetal)"/>

    <!-- Левая голова -->
    <path d="M 240,205
             C 232,190 220,178 208,172
             L 196,168 L 193,158
             L 208,155 L 222,160
             L 236,172
             L 244,188 Z"
          fill="url(#eagleMetal)"/>

    <!-- Правая голова -->
    <path d="M 272,205
             C 280,190 292,178 304,172
             L 316,168 L 319,158
             L 304,155 L 290,160
             L 276,172
             L 268,188 Z"
          fill="url(#eagleMetal)"/>

    <!-- Левая корона -->
    <path d="M 205,148 L 196,130 L 208,136 L 216,124
             L 224,138 L 230,128 L 234,148 Z"
          fill="url(#eagleMetal)"/>

    <!-- Правая корона -->
    <path d="M 307,148 L 316,130 L 304,136 L 296,124
             L 288,138 L 282,128 L 278,148 Z"
          fill="url(#eagleMetal)"/>

    <!-- Щит AIX внутри орла -->
    <path d="M 256,252
             C 248,258 242,265 242,272
             L 242,296
             C 248,308 253,315 256,318
             C 259,315 264,308 270,296
             L 270,272
             C 270,265 264,258 256,252 Z"
          fill="#FFE87A"
          stroke="#4A3800"
          stroke-width="1.6"/>

    <text x="256" y="298" text-anchor="middle"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="18" font-weight="900" fill="#4A3800"
          letter-spacing="0.5">AIX</text>

    <!-- Молния в теле (тонкая) -->
    <path d="M 253,225 L 244,248 L 254,248 L 249,266
             L 262,244 L 252,244 Z"
          fill="#FFE87A" opacity="0.95"/>
  </g>

  <!-- ===== Верхняя подсветка орла (металлический блик) ===== -->
  <g>
    <path d="M 218,235
             C 180,225 130,215 95,205
             L 125,222 L 88,222
             L 130,240 L 92,255
             L 140,262 L 105,278
             L 152,282 L 122,300
             L 168,298 L 195,278
             L 218,275 Z"
          fill="url(#eagleHighlight)"
          opacity="0.35"/>
    <path d="M 294,235
             C 332,225 382,215 417,205
             L 387,222 L 424,222
             L 382,240 L 420,255
             L 372,262 L 407,278
             L 360,282 L 390,300
             L 344,298 L 317,278
             L 294,275 Z"
          fill="url(#eagleHighlight)"
          opacity="0.35"/>
  </g>

  <!-- ===== Надпись AIX OS ===== -->
  <text x="256" y="462" text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="18" font-weight="900" fill="#4A3800"
        letter-spacing="7">AIX OS</text>

  <!-- ===== Финальные блики и тени ===== -->
  <circle cx="256" cy="256" r="242" fill="url(#shineTLB)"/>
  <circle cx="256" cy="256" r="242" fill="url(#shadowBRB)"/>
  <circle cx="256" cy="256" r="242" fill="url(#innerBevelB)"/>
</svg>