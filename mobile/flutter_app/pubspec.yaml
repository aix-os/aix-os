name: aix_os
description: "AIX OS — Операционная система для жизни"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # AIX OS Mobile
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  tdlib2: ^1.8.64
  mobile_scanner: ^7.1.2
  qr_flutter: ^4.1.0
  intl: ^0.20.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  pointycastle: ^4.0.0
  bip39_plus: ^1.1.1
  bip32_plus: ^1.0.0
  multicast_dns: ^0.3.3+1
  web_socket_channel: ^3.0.1
  emoji_picker_flutter: ^4.5.4
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/