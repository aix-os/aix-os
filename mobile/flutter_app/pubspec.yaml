name: aix_os
description: "AIX OS — Операционная система для жизни"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # === UI и связь ===
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  share_plus: ^10.1.2

  # === Криптография ===
  pointycastle: ^4.0.0
  crypto: ^3.0.7
  base58check: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/