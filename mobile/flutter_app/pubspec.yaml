name: aix_os
description: "AIX OS — Операционная система для жизни"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # AIX OS Mobile
  http: ^1.2.2                      # REST API
  provider: ^6.1.2                  # Управление состоянием
  shared_preferences: ^2.3.2        # Локальное хранилище
  flutter_secure_storage: ^9.2.2    # Безопасное хранилище ключей
  mobile_scanner: ^5.2.3            # QR-сканер
  qr_flutter: ^4.1.0                # Генерация QR
  intl: ^0.19.0                     # Форматирование
  url_launcher: ^6.3.0              # Открытие ссылок

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/